conky.config = {
    alignment = 'top_right',
    gap_x = 80,
    gap_y = 80,
    update_interval = 1.0,
    double_buffer = true,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    border_inner_margin = 10,
    border_outer_margin = 0,
    minimum_width = 500,
    maximum_width = 1000,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    use_xft = true,
    font = 'FiraCode Nerd Font Mono:size=11',
    text_buffer_size = 2048,
    override_utf8_locale = true,
    default_color = 'white',
};

conky.text = [[
${color grey}System Keybindings${color}
-------------------------
${color lightgrey}Terminal: ${color}${alignr}Super+Enter
${color lightgrey}Gnome Terminal: ${color}${alignr}Ctrl+Alt+T

${color lightgrey}Web Browser: ${color}${alignr}Super+Shift+B

${color lightgrey}Text Editor (vscode): ${color}${alignr}Ctrl+Shift+E

${color lightgrey}File Manager: ${color}${alignr}Super+Shift+N
${color lightgrey}File Manager (pcmanfm): ${color}${alignr}Super+F

${color lightgrey}Run Launcher: ${color}${alignr}Super+R
${color lightgrey}Change Window: ${color}${alignr}Super+W
${color lightgrey}Close Window (Program): ${color}${alignr}Super+Q
# ${color lightgrey}Screenshot: ${color}${alignr}PrtSc


${color grey}System Monitoring${color}
-------------------------
${color lightgrey}CPU Usage: ${color}${alignr}${cpu cpu0}%

${color lightgrey}RAM Usage: ${color}${alignr}${mem} / ${memmax} (${memperc}%)
${membar 8,500}
${color lightgrey}Swap Usage: ${color}${alignr}${swap} / ${swapmax} (${swapperc}%)

${color lightgrey}Uptime: ${color}${alignr}${uptime}



${color grey}Special Characters${color}
PRESS Ctrl+Shift+u followed by the following codes: 
-----------------------
${color lightgrey} a: ${color} e1
${color lightgrey} e: ${color} e9
${color lightgrey} i: ${color} ed
${color lightgrey} o: ${color} f3
${color lightgrey} u: ${color} fa
${color lightgrey} n: ${color} f1

${color grey}Key Programs Running${color}
-------------------------
${color lightgrey}VSCode: ${color}${alignr}${execi 5 pgrep -c code} instance(s)
${color lightgrey}Terminal: ${color}${alignr}${execi 5 pgrep -c kitty} instance(s)

${color lightgrey}Meshtools3d: ${color}${alignr}${execi 5 pgrep -c meshtools3d} instance(s)
${color lightgrey}SegSmooth: ${color}${alignr}${execi 5 pgrep -fc "python3 .*segsmooth*"} instance(s)

${color lightgrey}BUILDING: ${color}${alignr}${execi 5 pgrep -c make} instance(s)


]];
